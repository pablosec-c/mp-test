name: Sync MP → Supabase

on:
  # Corre solo cada día a las 6:00 AM Argentina (9:00 UTC)
  schedule:
    - cron: '0 9 * * *'
  # También se puede correr a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install xlsx@0.18.5

      - name: Sync MP → Supabase
        env:
          MP_TOKEN: ${{ secrets.MP_TOKEN }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node sync-mp.js
